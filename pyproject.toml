[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "probstat-library"
version = "0.21.0"
description = "A citation-first, layered probability and statistics library."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Ayberk" }]
maintainers = [{ name = "Ayberk" }]
keywords = [
  "probability",
  "statistics",
  "uncertainty-quantification",
  "reliability",
  "monte-carlo",
  "bayesian-inference",
  "sensitivity-analysis",
  "risk-analysis",
  "education",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ayberkdt/Stats-Lab"
Repository = "https://github.com/ayberkdt/Stats-Lab"
Issues = "https://github.com/ayberkdt/Stats-Lab/issues"
Changelog = "https://github.com/ayberkdt/Stats-Lab/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ayberkdt/Stats-Lab/tree/main/docs"

[project.optional-dependencies]
visualization = ["matplotlib>=3.8"]
numerics = ["numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6,<0.17", "mypy>=1.11,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probstat = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["probstat"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "mpl_toolkits", "mpl_toolkits.*", "cycler"]
ignore_missing_imports = true

