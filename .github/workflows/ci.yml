name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,visualization]"
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy src/probstat
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Examples run
        env:
          MPLBACKEND: Agg
        run: |
          for lab in examples/*.py; do python "$lab"; done
